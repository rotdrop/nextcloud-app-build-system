# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Reusable workflow building the ready-to-use app archive (the same
# artifact as `make appstore`) and uploading it as a workflow artifact.
# It serves both as the build stage of the release workflow and as a
# check on pull requests, so the two can never drift apart.
#
# The app id and version are read from appinfo/info.xml. The app is built
# in its own checkout; normally no Nextcloud server tree is needed for
# building. A server is cloned and installed when `release` is true (signing
# needs occ) or when `build-server` is true (apps whose dev scripts bootstrap
# Nextcloud); in that case the app is bind-mounted at <server>/apps/<id> and
# built there.
name: Build app archive

on:
  workflow_call:
    inputs:
      php-version:
        description: PHP version used for the build
        type: string
        default: '8.4'
      php-extensions:
        description: PHP extensions to install; the default suits the Nextcloud server install needed for signing
        type: string
        default: ctype, curl, dom, fileinfo, gd, iconv, intl, mbstring, openssl, pdo_sqlite, posix, simplexml, sqlite3, xml, zip, apcu, bcmath, gmp, imagick
      php-ini-values:
        description: PHP ini values
        type: string
        default: apc.enable_cli=1, memory_limit=1G
      node-version:
        description: Node.js version used for the build
        type: string
        default: '24'
      apt-packages:
        description: Extra space-separated apt packages; libxml-xpath-perl and rsync are always installed
        type: string
        default: ''
      make-args:
        description: Extra arguments for `make appstore`, e.g. APPSTORE_COMPRESSION=J
        type: string
        default: ''
      verify-script:
        description: Optional script path relative to the app root, run after the build with APP_ID, APP_VERSION and ARCHIVE in the environment
        type: string
        default: ''
      check-ts-types:
        description: Type-check the generated TypeScript modules if typescript is installed
        type: boolean
        default: true
      check-js-bundles:
        description: Fail if the archive contains no JS bundles
        type: boolean
        default: true
      release:
        description: Run in the protected environment and sign the archive using the secrets (unless sign is false)
        type: boolean
        default: false
      sign:
        description: Only used if release is true; false builds an unsigned archive without server, keys or certificate
        type: boolean
        default: true
      environment:
        description: Name of the protected environment used if release is true
        type: string
        default: release
      composer-use-github-api:
        description: Let Composer use the GitHub API for github.com VCS repositories. Set to false to make it clone with git instead, which avoids exhausting the API rate limit ("Could not authenticate against github.com") for apps with many VCS repositories in composer.json
        type: boolean
        default: true
      build-server:
        description: Build inside a Nextcloud server tree, the app is bind-mounted at <server>/apps/<app id>. Needed by apps whose dev scripts bootstrap Nextcloud (e.g. cafevdb); the same server is used for signing
        type: boolean
        default: false
      signing-server-repository:
        description: Repository providing the server (occ for signing, and the build if build-server is true)
        type: string
        default: nextcloud/server
      signing-server-ref:
        description: Branch or tag of the server, e.g. stable35 for apps targeting that release
        type: string
        default: master
    # The release caller must use `secrets: inherit` or pass these.
    secrets:
      APP_PRIVATE_KEY:
        description: Private key for signing, required if release is true
        required: false
      APP_PUBLIC_CRT:
        description: Public certificate for signing, required if release is true
        required: false
    outputs:
      id:
        description: The app id read from appinfo/info.xml
        value: ${{ jobs.build.outputs.id }}
      version:
        description: The app version read from appinfo/info.xml
        value: ${{ jobs.build.outputs.version }}
      artifact:
        description: Name of the uploaded artifact
        value: ${{ jobs.build.outputs.artifact }}
      archive-filename:
        description: Exact filename of the uploaded app archive
        value: ${{ jobs.build.outputs.archive-filename }}
      source-sha:
        description: Full SHA of the app checkout used for the build
        value: ${{ jobs.build.outputs.source-sha }}
      source-ref:
        description: GitHub ref associated with the app checkout
        value: ${{ jobs.build.outputs.source-ref }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ inputs.release && inputs.environment || '' }}
    timeout-minutes: 45
    env:
      COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'
    outputs:
      id: ${{ steps.meta.outputs.id }}
      version: ${{ steps.meta.outputs.version }}
      artifact: ${{ steps.meta.outputs.artifact }}
      archive-filename: ${{ steps.sanity.outputs.archive-filename }}
      source-sha: ${{ steps.source.outputs.sha }}
      source-ref: ${{ steps.source.outputs.ref }}
    steps:
      - name: Use HTTPS for submodules
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Checkout app
        uses: actions/checkout@v5
        with:
          # dev-scripts/lib is a git submodule.
          submodules: recursive
          persist-credentials: false

      - name: Record app checkout provenance
        id: source
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "ref=$GITHUB_REF" >> "$GITHUB_OUTPUT"

      - name: Install build utilities
        env:
          EXTRA_PACKAGES: ${{ inputs.apt-packages }}
        run: |
          sudo apt-get update
          # EXTRA_PACKAGES is intentionally split into words.
          sudo apt-get install -y --no-install-recommends libxml-xpath-perl rsync $EXTRA_PACKAGES

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          extensions: ${{ inputs.php-extensions }}
          tools: composer:v2
          coverage: none
          ini-values: ${{ inputs.php-ini-values }}

      - name: Configure Composer
        if: "!inputs.composer-use-github-api"
        run: composer config --global use-github-api false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node-version }}

      - name: Read app id and version
        id: meta
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          IS_RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail
          id=$(php -r 'echo (string)simplexml_load_file("appinfo/info.xml")->id;')
          version=$(php -r 'echo (string)simplexml_load_file("appinfo/info.xml")->version;')
          test -n "$id" && test -n "$version" || { echo "::error::appinfo/info.xml lacks id or version"; exit 1; }
          artifact="$id-$version"
          if [ "$IS_RELEASE" != true ]; then artifact="$artifact-ci-$SOURCE_SHA"; fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"

      - name: Set up Nextcloud server
        id: server
        if: inputs.build-server || (inputs.release && inputs.sign)
        uses: rotdrop/nextcloud-app-build-system/.github/actions/nextcloud-server@v1
        with:
          repository: ${{ inputs.signing-server-repository }}
          ref: ${{ inputs.signing-server-ref }}

      - name: Check signing secrets
        if: inputs.release && inputs.sign
        env:
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          APP_PUBLIC_CRT: ${{ secrets.APP_PUBLIC_CRT }}
        run: |
          test -n "$APP_PRIVATE_KEY" || { echo "::error::APP_PRIVATE_KEY is missing"; exit 1; }
          test -n "$APP_PUBLIC_CRT" || { echo "::error::APP_PUBLIC_CRT is missing"; exit 1; }

      - name: Build app archive
        env:
          # Empty unless signing, then the Makefile signs the files and the archive.
          APP_PRIVATE_KEY: ${{ inputs.release && inputs.sign && secrets.APP_PRIVATE_KEY || '' }}
          APP_PUBLIC_CRT: ${{ inputs.release && inputs.sign && secrets.APP_PUBLIC_CRT || '' }}
          SIGN_ARGS: ${{ inputs.release && inputs.sign && format('OCC={0}', steps.server.outputs.occ) || 'APPSTORE_SIGN=0' }}
          MAKE_ARGS: ${{ inputs.make-args }}
        working-directory: ${{ inputs.build-server && steps.server.outputs.app-dir || github.workspace }}
        run: make appstore $SIGN_ARGS $MAKE_ARGS

      - name: Check generated TypeScript modules
        if: inputs.check-ts-types
        run: |
          if [ -x node_modules/.bin/tsc ] && [ -d build/ts-types/php-modules ]; then
            node_modules/.bin/tsc --ignoreConfig --noEmit \
              --allowImportingTsExtensions --target es2022 --module nodenext \
              $(find build/ts-types/php-modules -name '*.ts')
          else
            echo "No typescript or generated modules, skipping."
          fi

      - name: Sanity-check the archive
        id: sanity
        env:
          APP_ID: ${{ steps.meta.outputs.id }}
          APP_VERSION: ${{ steps.meta.outputs.version }}
          APP_ARTIFACT: ${{ steps.meta.outputs.artifact }}
          IS_RELEASE: ${{ inputs.release }}
          CHECK_JS: ${{ inputs.check-js-bundles }}
        run: |
          set -euo pipefail
          # the glob also matches the detached signature, so skip it
          archives=()
          for file in build/artifacts/appstore/"$APP_ID-$APP_VERSION".tar.*; do
            case "$file" in *.sig) ;; *) [ -f "$file" ] && archives+=("$file");; esac
          done
          [ "${#archives[@]}" -eq 1 ] || { echo "::error::Expected exactly one archive, found ${#archives[@]}: ${archives[*]}"; exit 1; }
          archive=${archives[0]}
          if [ "$IS_RELEASE" != true ]; then
            filename="$APP_ARTIFACT.tar.${archive##*.tar.}"
            qualified="$PWD/build/artifacts/appstore/$filename"
            mv "$archive" "$qualified"
            if [ -f "$archive.sig" ]; then mv "$archive.sig" "$qualified.sig"; fi
            archive=$qualified
          fi
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
          echo "archive-filename=$(basename "$archive")" >> "$GITHUB_OUTPUT"
          if [ "$CHECK_JS" = true ]; then
            count=$(tar -taf "$archive" | grep -Ec "^$APP_ID/js/.*\.m?js$" || true)
            echo "JS bundles in archive: $count"
            test "$count" -gt 0 || { echo "::error::No JS bundles in the archive - the bundler build produced nothing"; exit 1; }
          fi

      - name: Verify signature
        if: inputs.release && inputs.sign
        env:
          APP_ID: ${{ steps.meta.outputs.id }}
          APP_PUBLIC_CRT: ${{ secrets.APP_PUBLIC_CRT }}
          OCC: ${{ steps.server.outputs.occ }}
        run: |
          set -euo pipefail
          sign_dir="$PWD/build/artifacts/appstore/sign/$APP_ID"
          test -s "$sign_dir/appinfo/signature.json" || { echo "::error::The app files were not signed"; exit 1; }
          test -s "$ARCHIVE.sig" || { echo "::error::The archive was not signed"; exit 1; }
          php "$OCC" integrity:check-app --path="$sign_dir" "$APP_ID"
          crt=$(mktemp)
          trap 'rm -f "$crt"' EXIT
          printf '%s\n' "$APP_PUBLIC_CRT" > "$crt"
          openssl x509 -in "$crt" -checkend 0 -noout
          openssl x509 -in "$crt" -pubkey -noout > "$crt.pem"
          openssl dgst -sha512 -verify "$crt.pem" -signature "$ARCHIVE.sig" "$ARCHIVE"
          rm -f "$crt.pem"

      - name: Run verify script
        if: inputs.verify-script != ''
        env:
          APP_ID: ${{ steps.meta.outputs.id }}
          APP_VERSION: ${{ steps.meta.outputs.version }}
          VERIFY_SCRIPT: ${{ inputs.verify-script }}
        run: bash "$VERIFY_SCRIPT"

      - name: Collect release files
        env:
          APP_ID: ${{ steps.meta.outputs.id }}
          APP_VERSION: ${{ steps.meta.outputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_REF: ${{ steps.source.outputs.ref }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          name=$(basename "$ARCHIVE")
          cp "$ARCHIVE" "$RUNNER_TEMP/out/$name"
          if [ -f "$ARCHIVE.sig" ]; then cp "$ARCHIVE.sig" "$RUNNER_TEMP/out/$name.sig"; fi
          (cd "$RUNNER_TEMP/out" && sha256sum "$name" > "$name.sha256")
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          provenance = {
              "app_id": os.environ["APP_ID"],
              "app_version": os.environ["APP_VERSION"],
              "source_sha": os.environ["SOURCE_SHA"],
              "source_ref": os.environ["SOURCE_REF"],
              "workflow_run": (
                  f'{os.environ["GITHUB_SERVER_URL"]}/{os.environ["GITHUB_REPOSITORY"]}'
                  f'/actions/runs/{os.environ["GITHUB_RUN_ID"]}'
              ),
              "archive_filename": os.path.basename(os.environ["ARCHIVE"]),
          }
          out = Path(os.environ["RUNNER_TEMP"]) / "out"
          (out / "provenance.json").write_text(json.dumps(provenance, indent=2) + "\n")
          PY
          checksum=$(cut -d' ' -f1 "$RUNNER_TEMP/out/$name.sha256")
          {
            echo "## App archive provenance"
            echo
            echo "- App: \`$APP_ID@$APP_VERSION\`"
            echo "- Source SHA: \`$SOURCE_SHA\`"
            echo "- Source ref: \`$SOURCE_REF\`"
            echo "- Archive: \`$name\`"
            echo "- SHA-256: \`$checksum\`"
            echo "- Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.meta.outputs.artifact }}
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error
