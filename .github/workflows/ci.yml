# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Reusable CI workflow for apps using this build system: lint, clean-target
# idempotency and an unsigned archive build. No Nextcloud server tree is used unless
# `build-server` is true.
name: CI

on:
  workflow_call:
    inputs:
      php-versions:
        description: JSON array of PHP versions for the PHP lint job
        type: string
        default: '["8.2", "8.3", "8.4"]'
      php-version:
        description: PHP version used for the build jobs
        type: string
        default: '8.4'
      node-version:
        type: string
        default: '24'
      apt-packages:
        description: Extra space-separated apt packages
        type: string
        default: ''
      php-lint-dirs:
        description: Space-separated directories to lint, missing ones are skipped
        type: string
        default: lib appinfo templates
      verify-script:
        description: Optional script run after the build, see build-appstore.yml
        type: string
        default: ''
      make-args:
        type: string
        default: ''
      composer-use-github-api:
        description: Let Composer use the GitHub API for github.com VCS repositories. Set to false to make it clone with git instead, which avoids exhausting the API rate limit ("Could not authenticate against github.com") for apps with many VCS repositories in composer.json
        type: boolean
        default: true
      build-server:
        description: Build inside a Nextcloud server tree (the app is bind-mounted at <server>/apps/<app id>), for apps whose dev scripts bootstrap Nextcloud
        type: boolean
        default: false
      signing-server-repository:
        description: Repository providing the Nextcloud server
        type: string
        default: nextcloud/server
      signing-server-ref:
        description: Branch or tag of the Nextcloud server, e.g. stable35
        type: string
        default: master

permissions:
  contents: read

jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node-version }}
      - name: Install and lint
        run: |
          npm ci
          npm run lint

  php-lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ${{ fromJSON(inputs.php-versions) }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
      - name: Lint PHP files
        env:
          DIRS: ${{ inputs.php-lint-dirs }}
        run: |
          dirs=""
          for d in $DIRS; do [ -d "$d" ] && dirs="$dirs $d"; done
          [ -z "$dirs" ] && exit 0
          # shellcheck disable=SC2086
          find $dirs -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

  realclean:
    runs-on: ubuntu-latest
    env:
      COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install build utilities
        env:
          EXTRA_PACKAGES: ${{ inputs.apt-packages }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxml-xpath-perl rsync $EXTRA_PACKAGES
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          # the Nextcloud server install needs these
          extensions: ${{ inputs.build-server && 'ctype, curl, dom, fileinfo, gd, iconv, intl, mbstring, openssl, pdo_sqlite, posix, simplexml, sqlite3, xml, zip, apcu, bcmath, gmp, imagick' || '' }}
          tools: composer:v2
          coverage: none
          ini-values: ${{ inputs.build-server && 'apc.enable_cli=1, memory_limit=1G' || 'memory_limit=1G' }}
      - name: Configure Composer
        if: "!inputs.composer-use-github-api"
        run: composer config --global use-github-api false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node-version }}
      - name: Set up Nextcloud server
        id: server
        if: inputs.build-server
        uses: rotdrop/nextcloud-app-build-system/.github/actions/nextcloud-server@v1
        with:
          repository: ${{ inputs.signing-server-repository }}
          ref: ${{ inputs.signing-server-ref }}
      - name: realclean leaves a pristine tree, also after a build
        working-directory: ${{ inputs.build-server && steps.server.outputs.app-dir || github.workspace }}
        run: |
          check() {
            # realclean removes a tracked package-lock.json on purpose
            if git ls-files --error-unmatch -- package-lock.json > /dev/null 2>&1; then
              git restore -- package-lock.json
            fi
            if [ -n "$(git status --porcelain --ignored)" ]; then
              git status --porcelain --ignored
              echo "::error::$1 left files behind"
              exit 1
            fi
          }
          make realclean
          check "realclean"
          make realclean
          check "realclean"
          make build
          make realclean
          check "realclean after build"

  build:
    uses: rotdrop/nextcloud-app-build-system/.github/workflows/build-appstore.yml@v1
    with:
      php-version: ${{ inputs.php-version }}
      node-version: ${{ inputs.node-version }}
      apt-packages: ${{ inputs.apt-packages }}
      verify-script: ${{ inputs.verify-script }}
      make-args: ${{ inputs.make-args }}
      composer-use-github-api: ${{ inputs.composer-use-github-api }}
      build-server: ${{ inputs.build-server }}
      signing-server-repository: ${{ inputs.signing-server-repository }}
      signing-server-ref: ${{ inputs.signing-server-ref }}
