# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Reusable release workflow. Call it from a tag-triggered workflow
# (`on: push: tags: ['v*']`) with `secrets: inherit` and
# `permissions: contents: write` (the publish job creates the GitHub release;
# a called workflow cannot elevate permissions granted by its caller).
# The tag must be `v<version>` with the version from appinfo/info.xml; a
# version containing `-` is published as a pre-release (uploaded to the app
# store as nightly). With `sign: false` an unsigned archive is attached.
name: Release

on:
  workflow_call:
    inputs:
      php-version:
        type: string
        default: '8.4'
      node-version:
        type: string
        default: '24'
      python-version:
        description: Optional Python version used for the build; empty skips setup
        type: string
        default: ''
      apt-packages:
        type: string
        default: ''
      make-args:
        type: string
        default: ''
      verify-script:
        description: Optional script run in the build, see build-appstore.yml
        type: string
        default: ''
      composer-use-github-api:
        description: Let Composer use the GitHub API for github.com VCS repositories. Set to false to make it clone with git instead, which avoids exhausting the API rate limit ("Could not authenticate against github.com") for apps with many VCS repositories in composer.json
        type: boolean
        default: true
      build-server:
        description: Build inside a Nextcloud server tree (the app is bind-mounted at <server>/apps/<app id>), for apps whose dev scripts bootstrap Nextcloud
        type: boolean
        default: false
      signing-server-repository:
        description: Repository providing the Nextcloud server
        type: string
        default: nextcloud/server
      signing-server-ref:
        description: Branch or tag of the Nextcloud server, e.g. stable35
        type: string
        default: master
      environment:
        description: Protected environment holding the signing secrets
        type: string
        default: release
      sign:
        description: Sign the app files and the archive; false builds and attaches an unsigned archive (and implies no app store upload)
        type: boolean
        default: true
      upload-to-appstore:
        description: Upload to the Nextcloud app store, pre-releases (version contains a dash) go to the nightly channel; skipped for unsigned builds and if the APPSTORE_TOKEN secret is absent
        type: boolean
        default: true
      download-base-url:
        description: Base URL of the release assets, defaults to the GitHub release download URL
        type: string
        default: ''
    secrets:
      APP_PRIVATE_KEY:
        required: false
      APP_PUBLIC_CRT:
        required: false
      APPSTORE_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          coverage: none
      - name: Check tag against appinfo/info.xml
        id: check
        run: |
          version=$(php -r 'echo (string)simplexml_load_file("appinfo/info.xml")->version;')
          [ "$GITHUB_REF_TYPE" = tag ] || { echo "::error::Not a tag run"; exit 1; }
          [ "$GITHUB_REF_NAME" = "v$version" ] || {
            echo "::error::Tag $GITHUB_REF_NAME does not match info.xml version $version"; exit 1; }
          case "$version" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT";; *) echo "prerelease=false" >> "$GITHUB_OUTPUT";; esac

  build:
    needs: validate
    uses: rotdrop/nextcloud-app-build-system/.github/workflows/build-appstore.yml@v1
    with:
      release: true
      sign: ${{ inputs.sign }}
      environment: ${{ inputs.environment }}
      php-version: ${{ inputs.php-version }}
      node-version: ${{ inputs.node-version }}
      python-version: ${{ inputs.python-version }}
      apt-packages: ${{ inputs.apt-packages }}
      make-args: ${{ inputs.make-args }}
      verify-script: ${{ inputs.verify-script }}
      composer-use-github-api: ${{ inputs.composer-use-github-api }}
      build-server: ${{ inputs.build-server }}
      signing-server-repository: ${{ inputs.signing-server-repository }}
      signing-server-ref: ${{ inputs.signing-server-ref }}
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      APP_PUBLIC_CRT: ${{ secrets.APP_PUBLIC_CRT }}

  publish:
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: assets
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          notes=$(mktemp)
          if [ -f release-notes.md ]; then
            cp release-notes.md "$notes"
          elif [ -f CHANGELOG.md ]; then
            # the section of the released version, up to the next heading
            awk -v v="$APP_VERSION" '
              /^##+ / { if (found) exit; if (index($0, v)) { found = 1; next } }
              found { print }' CHANGELOG.md > "$notes"
          fi
          [ -s "$notes" ] || echo "Release $APP_VERSION" > "$notes"
          flags=""
          [ "$PRERELEASE" = true ] && flags="--prerelease"
          gh release create "$GITHUB_REF_NAME" assets/* \
            --title "$GITHUB_REF_NAME" --notes-file "$notes" $flags

  publish-appstore:
    if: inputs.upload-to-appstore && inputs.sign
    needs: [validate, build, publish]
    runs-on: ubuntu-latest
    # APPSTORE_TOKEN is typically an environment secret like the signing keys
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: assets
      - name: Register release in the app store
        env:
          APPSTORE_TOKEN: ${{ secrets.APPSTORE_TOKEN }}
          NIGHTLY: ${{ needs.validate.outputs.prerelease }}
          BASE_URL: ${{ inputs.download-base-url || format('{0}/{1}/releases/download/{2}', github.server_url, github.repository, github.ref_name) }}
          ARCHIVE_FILENAME: ${{ needs.build.outputs.archive-filename }}
        run: |
          set -euo pipefail
          if [ -z "$APPSTORE_TOKEN" ]; then
            msg="APPSTORE_TOKEN is not available (secret missing, or not in the '${{ inputs.environment }}' environment)"
            if [ "$NIGHTLY" = true ]; then
              echo "::warning::$msg, the pre-release was NOT uploaded to the app store"
              exit 0
            fi
            echo "::error::$msg, cannot upload the stable release to the app store. Add the secret or call the workflow with upload-to-appstore: false"
            exit 1
          fi
          archive="assets/$ARCHIVE_FILENAME"
          test -f "$archive" || { echo "::error::Archive $ARCHIVE_FILENAME is missing"; exit 1; }
          signature=$(base64 -w0 "$archive.sig")
          download_url="$BASE_URL/$(basename "$archive")"
          # the app store downloads the archive itself, so it must be public
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors "$download_url" --output "$RUNNER_TEMP/download.tar.gz"
          cmp "$archive" "$RUNNER_TEMP/download.tar.gz"
          jq -n --arg download "$download_url" --arg signature "$signature" --arg nightly "$NIGHTLY" \
            '{download: $download, signature: $signature, nightly: ($nightly == "true")}' \
            > "$RUNNER_TEMP/appstore-release.json"
          status=$(curl -sS --fail-with-body -o "$RUNNER_TEMP/appstore-response.txt" -w '%{http_code}' \
            -X POST https://apps.nextcloud.com/api/v1/apps/releases \
            -H "Authorization: Token $APPSTORE_TOKEN" -H 'Content-Type: application/json' \
            -d "@$RUNNER_TEMP/appstore-release.json") || {
              echo "::error::App store upload failed (HTTP ${status:-unknown})"
              cat "$RUNNER_TEMP/appstore-response.txt"; echo
              exit 1
            }
          # 201: release created, 200: existing release updated
          echo "App store upload of $download_url (nightly=$NIGHTLY) answered HTTP $status"
          cat "$RUNNER_TEMP/appstore-response.txt"; echo
